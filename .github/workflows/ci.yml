name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm db:generate

      - run: pnpm --filter api lint

      - run: pnpm --filter @intelliforge/api-core lint

      - run: pnpm --filter web lint

      - run: pnpm --filter @intelliforge/ingestion lint

      - run: pnpm --filter @remoteforge/ingestion-worker lint

      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_APP_URL: https://remoteforge.intelliforge.tech
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
          API_URL: http://127.0.0.1:8080

  deploy-api:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.changes.outputs.api == 'true'

      - name: Deploy API to Fly.io
        if: steps.changes.outputs.api == 'true'
        run: flyctl deploy . --config apps/api/fly.toml --dockerfile apps/api/Dockerfile --ha=false --primary-region sin --regions sin --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
