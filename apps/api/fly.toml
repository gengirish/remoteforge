app = "remoteforge-api"
primary_region = "bom"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 0 = the proxy may stop the last machine when idle and boot it on the next
  # request. Safe only because /health no longer queries Postgres: Fly checks
  # do not count as traffic, so nothing here holds the machine or the DB awake.
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "60s"
    method = "GET"
    # Liveness only — must stay on a route that does not query Postgres,
    # otherwise the Neon compute never autosuspends.
    path = "/health"
    timeout = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
